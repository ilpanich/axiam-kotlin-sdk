name: SDK CI — Kotlin

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This SDK has TWO version axes, and floor + newest applies to both:
        #
        #   JVM     — jvmTarget stays JVM_17 on every leg; the question is which
        #             runtime executes that bytecode.
        #   Kotlin  — the compiler that produces the .class files and the
        #             @Metadata a consumer's compiler reads back.
        #
        # Rather than a 2x2 grid, the two legs pin the two ENDS: everything at
        # its floor, and everything at its newest. A failure on `newest` is
        # worth bisecting by hand precisely because it should be rare.
        #
        # The Kotlin axis matters in a way the JVM one does not: 2.1.0 is what
        # is PUBLISHED, and Kotlin metadata is forward-compatible, so a consumer
        # on 2.4 must be able to read a 2.1-compiled library. Bumping the
        # published compiler would instead RAISE the floor for every consumer
        # still on 2.1-2.3, so it stays at 2.1.0 and the newest leg proves the
        # forward direction. This is the same shape as the JVM axis: build at
        # the floor, prove it runs at the newest.
        #
        # VersionPolicyTest fails if these legs and the build's own declared
        # versions ever stop agreeing.
        include:
          - name: floor — JDK 17, Kotlin 2.1.0
            java: '17'
            kotlin: '2.1.0'
          - name: newest — JDK 25, Kotlin 2.4.10
            java: '25'
            kotlin: '2.4.10'
    steps:
      - uses: actions/checkout@v4

      # Both JDKs on every leg, with 17 LAST so it becomes JAVA_HOME and is
      # therefore the JVM Gradle itself runs on.
      #
      # That ordering is load-bearing. Gradle 8.10.2 cannot run on Java 25 — it
      # aborts with a bare, unrecognised "25.0.4" before configuring anything —
      # so pointing JAVA_HOME at 25 does not test the SDK on Java 25, it just
      # kills the build. What the SDK actually claims is that its JVM 17
      # bytecode RUNS on a modern JVM, which is a statement about the test
      # launcher rather than about Gradle's own runtime. `-PtestJavaVersion`
      # (see build.gradle.kts) forks the test JVM on exactly that version while
      # Gradle stays on a JDK it supports.
      - name: Set up JDKs (Gradle runs on 17; tests fork on ${{ matrix.java }})
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            25
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and coverage report
        run: >
          ./gradlew build test koverXmlReport --no-daemon
          -PkotlinVersion=${{ matrix.kotlin }}
          -PtestJavaVersion=${{ matrix.java }}

      # The coverage floor is a property of the source, not of the toolchain, so
      # it is verified once — on the floor leg, which is what gets published.
      - name: Coverage verification (>= 98% line, enforced floor)
        if: matrix.kotlin == '2.1.0'
        run: >
          ./gradlew koverVerify --no-daemon
          -PkotlinVersion=${{ matrix.kotlin }}
          -PtestJavaVersion=${{ matrix.java }}

  tls-bypass-gate:
    name: TLS-bypass gate (§6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # §6: strict TLS is always on; the only escape hatch is customCa(pem).
      # No trust-all TrustManager / permissive HostnameVerifier / insecure
      # identifier may appear in src/main.
      - name: No TLS-bypass patterns in src/main
        run: bash scripts/tls-bypass-gate.sh

  management-drift-check:
    name: "§27 management surface drift-check"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CONTRACT.md §27: the management surface is GENERATED from the vendored
      # management-registry.json and openapi.json, and the generated output is
      # committed. Committing it is what makes the API reviewable in a diff and
      # navigable in an IDE; this job is what stops the committed copy and the
      # vendored contract drifting apart. It fails if a re-vendored registry was
      # not regenerated against, or if a generated file was hand-edited.
      - name: python3 scripts/gen_management.py --check
        run: python3 scripts/gen_management.py --check

  private-key-scan:
    name: No committed private keys
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any committed PEM private key header
        run: |
          if git grep -nE "BEGIN (RSA |EC )?PRIVATE KEY" -- . ; then
            echo "::error::a PEM private key header is committed — test PKI must be generated at runtime"
            exit 1
          fi
          echo "OK: no private key material committed"

  dokka-gate:
    name: Dokka API docs build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # javadoc.io serves the Dokka javadoc jar; a broken docs build is a real
      # user-facing gap, so build it in CI.
      - name: dokkaJavadocJar
        run: ./gradlew dokkaJavadocJar --no-daemon

  # Publishing to Maven Central is IRREVERSIBLE and refuses to re-use a version.
  # Git tags are not branch-scoped, so a release tag cut on a feature branch must
  # be proven to be on main before the publish job runs.
  verify-tag-on-main:
    name: Verify tag is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is NOT on origin/main. Release tags must be cut from main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."
      - name: Assert the tag matches gradle.properties version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          proj_version="$(grep -E '^version=' gradle.properties | cut -d= -f2)"
          if [ "${tag_version}" != "${proj_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies ${tag_version}, but gradle.properties declares ${proj_version}."
            exit 1
          fi
          echo "OK: tag and gradle.properties agree on ${tag_version}."

  publish:
    name: Publish to Maven Central
    # Manual-on-tag, side-effecting: runs only on a vX.Y.Z tag push, never on a
    # pull_request, so the GPG_PRIVATE_KEY / CENTRAL_TOKEN_* secrets are never
    # exposed to a PR-triggered job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish (GPG-signed) to the OSSRH Staging API
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: ./gradlew publish --no-daemon

      # `./gradlew publish` only does the OSSRH-protocol PUTs, which land the
      # artifacts in an *open* staging repository on the OSSRH Staging API. The
      # maven-publish plugin never closes/forwards that repo, so without this
      # step the deployment never reaches the Central Portal Deployments view and
      # is never published — the build goes green but nothing lands on Central.
      #
      # This POST closes the namespace's default staging repository and forwards
      # it to the Portal. publishing_type=automatic auto-releases to Maven
      # Central once validation passes; switch to user_managed to instead have it
      # wait for a manual "Publish" click in the Deployments view.
      - name: Close & forward the staging repository to the Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          namespace="$(grep -E '^group=' gradle.properties | cut -d= -f2)"
          token="$(printf '%s:%s' "${CENTRAL_TOKEN_USERNAME}" "${CENTRAL_TOKEN_PASSWORD}" | base64 -w0)"
          echo "Forwarding default staging repository for namespace '${namespace}' to the Central Portal…"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${token}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${namespace}?publishing_type=automatic"
