name: SDK CI — Kotlin

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This SDK has TWO version axes, and floor + newest applies to both:
        #
        #   JVM     — jvmTarget stays JVM_17 on every leg; the question is which
        #             runtime executes that bytecode.
        #   Kotlin  — the compiler that produces the .class files and the
        #             @Metadata a consumer's compiler reads back.
        #
        # Rather than a 2x2 grid, the two legs pin the two ENDS: everything at
        # its floor, and everything at its newest. A failure on `newest` is
        # worth bisecting by hand precisely because it should be rare.
        #
        # The Kotlin axis matters in a way the JVM one does not: 2.1.0 is what
        # is PUBLISHED, and Kotlin metadata is forward-compatible, so a consumer
        # on 2.4 must be able to read a 2.1-compiled library. Bumping the
        # published compiler would instead RAISE the floor for every consumer
        # still on 2.1-2.3, so it stays at 2.1.0 and the newest leg proves the
        # forward direction. This is the same shape as the JVM axis: build at
        # the floor, prove it runs at the newest.
        #
        # VersionPolicyTest fails if these legs and the build's own declared
        # versions ever stop agreeing.
        include:
          - name: floor — JDK 17, Kotlin 2.1.0
            java: '17'
            kotlin: '2.1.0'
          - name: newest — JDK 25, Kotlin 2.4.10
            java: '25'
            kotlin: '2.4.10'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Both JDKs on every leg, with 17 LAST so it becomes JAVA_HOME and is
      # therefore the JVM Gradle itself runs on.
      #
      # That ordering is load-bearing. Gradle 8.10.2 cannot run on Java 25 — it
      # aborts with a bare, unrecognised "25.0.4" before configuring anything —
      # so pointing JAVA_HOME at 25 does not test the SDK on Java 25, it just
      # kills the build. What the SDK actually claims is that its JVM 17
      # bytecode RUNS on a modern JVM, which is a statement about the test
      # launcher rather than about Gradle's own runtime. `-PtestJavaVersion`
      # (see build.gradle.kts) forks the test JVM on exactly that version while
      # Gradle stays on a JDK it supports.
      - name: Set up JDKs (Gradle runs on 17; tests fork on ${{ matrix.java }})
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: |
            25
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      - name: Build, test, and coverage report
        run: >
          ./gradlew build test koverXmlReport --no-daemon
          -PkotlinVersion=${{ matrix.kotlin }}
          -PtestJavaVersion=${{ matrix.java }}

      # The coverage floor is a property of the source, not of the toolchain, so
      # it is verified once — on the floor leg, which is what gets published.
      - name: Coverage verification (>= 98% line, enforced floor)
        if: matrix.kotlin == '2.1.0'
        run: >
          ./gradlew koverVerify --no-daemon
          -PkotlinVersion=${{ matrix.kotlin }}
          -PtestJavaVersion=${{ matrix.java }}

  tls-bypass-gate:
    name: TLS-bypass gate (§6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # §6: strict TLS is always on; the only escape hatch is customCa(pem).
      # No trust-all TrustManager / permissive HostnameVerifier / insecure
      # identifier may appear in src/main.
      - name: No TLS-bypass patterns in src/main
        run: bash scripts/tls-bypass-gate.sh

  management-drift-check:
    name: "§27 management surface drift-check"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # CONTRACT.md §27: the management surface is GENERATED from the vendored
      # management-registry.json and openapi.json, and the generated output is
      # committed. Committing it is what makes the API reviewable in a diff and
      # navigable in an IDE; this job is what stops the committed copy and the
      # vendored contract drifting apart. It fails if a re-vendored registry was
      # not regenerated against, or if a generated file was hand-edited.
      - name: python3 scripts/gen_management.py --check
        run: python3 scripts/gen_management.py --check

  private-key-scan:
    name: No committed private keys
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Fail on any committed PEM private key header
        run: |
          if git grep -nE "BEGIN (RSA |EC )?PRIVATE KEY" -- . ; then
            echo "::error::a PEM private key header is committed — test PKI must be generated at runtime"
            exit 1
          fi
          echo "OK: no private key material committed"

  dokka-gate:
    name: Dokka API docs build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
      # javadoc.io serves the Dokka javadoc jar; a broken docs build is a real
      # user-facing gap, so build it in CI.
      - name: dokkaJavadocJar
        run: ./gradlew dokkaJavadocJar --no-daemon

  # H-1 (second half). Sigstore bundles did NOT ship with the rest of the H-1
  # pass because the plugin configures on the *release* path, so a
  # misconfiguration is invisible until the next tag and then breaks it — and no
  # throwaway-version validation run was available. This job is the answer to
  # that, and a better one than a one-off run: on every pull request it performs
  # a REAL keyless signing of the real publication, proving the whole chain
  # (Actions OIDC -> Fulcio certificate -> Rekor entry -> `.sigstore.json`
  # attached to the publication) before a tag ever depends on it.
  #
  # Nothing leaves the runner: `publishToMavenLocal` writes to the runner's own
  # ~/.m2 and never touches the OSSRH Staging API, and this job holds no
  # CENTRAL_TOKEN_* secret to reach it with.
  #
  # Same-repository pull requests only. A fork's `pull_request` token cannot mint
  # an OIDC token whatever `permissions:` says, so on a fork this job would fail
  # for a reason that has nothing to do with the contributor's change.
  sigstore-sign-gate:
    name: Sigstore bundle gate (H-1)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Fulcio issues the signing certificate against this job's OIDC identity.
      # Without this permission ACTIONS_ID_TOKEN_REQUEST_URL is absent,
      # sigstore-java finds no ambient provider, and — because CI=true disables
      # its browser fallback — fails fast rather than hanging on a prompt no one
      # can answer.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      # PGP alongside Sigstore, because the INTERACTION is the part worth
      # testing: Gradle's `signing` plugin reacts to artifacts being added to a
      # publication, so left alone it would sign the Sigstore bundles too and
      # publish `.sigstore.json.asc` files Central has no use for. The sigstore
      # plugin removes them; the assertion below is what notices if that ever
      # stops being true.
      #
      # The key is ephemeral, throwaway and CI-only (never committed, one-day
      # expiry, empty passphrase) — the real GPG_PRIVATE_KEY is never exposed to
      # a PR-triggered job. RSA rather than the ed25519 the Maven-side gate
      # uses: this one goes through Gradle's in-memory PGP reader rather than
      # the gpg binary.
      - name: Generate an ephemeral GPG signing key
        run: |
          set -euo pipefail
          gpg --batch --pinentry-mode loopback --passphrase "" \
              --quick-generate-key "AXIAM CI (ephemeral, do not trust)" rsa3072 sign 1d
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          {
            echo "GPG_PRIVATE_KEY<<AXIAM_EPHEMERAL_KEY_EOF"
            gpg --batch --pinentry-mode loopback --passphrase "" \
                --armor --export-secret-keys "${keyid}"
            echo "AXIAM_EPHEMERAL_KEY_EOF"
          } >> "${GITHUB_ENV}"

      - name: publishToMavenLocal with Sigstore signing (real signing, nothing uploaded)
        env:
          GPG_PASSPHRASE: ''
        run: ./gradlew publishToMavenLocal --no-daemon -Psigstore.enabled=true

      # A green signing task is not the claim; the claim is that the deployment
      # will carry a bundle for every file it uploads. Assert it over what was
      # actually installed, so a publishable artifact added later (a new
      # classifier, a second publication) is covered without editing this list.
      - name: Assert a .sigstore.json exists for every publishable file
        run: |
          set -euo pipefail
          version="$(grep -E '^version=' gradle.properties | cut -d= -f2)"
          dir="${HOME}/.m2/repository/io/github/ilpanich/axiam-sdk-kotlin/${version}"
          if [ ! -d "${dir}" ]; then
            echo "::error::nothing was published to ${dir}"
            exit 1
          fi
          echo "Published files:"
          ls -1 "${dir}"

          missing=0
          for f in "${dir}"/*; do
            name="$(basename "${f}")"
            case "${name}" in
              *.asc|*.sigstore.json|*.md5|*.sha1|*.sha256|*.sha512|maven-metadata-local.xml)
                continue ;;
            esac
            if [ ! -f "${dir}/${name}.sigstore.json" ]; then
              echo "::error::missing Sigstore bundle for ${name}"
              missing=1
            elif ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "${dir}/${name}.sigstore.json"; then
              echo "::error::${name}.sigstore.json is not valid JSON"
              missing=1
            fi
            if [ ! -f "${dir}/${name}.asc" ]; then
              echo "::error::missing PGP signature for ${name}"
              missing=1
            fi
          done

          # A signature of a signature: Central wants one signature per
          # artifact, and the sigstore plugin strips these by default. If one
          # appears, that default has stopped applying. Globbed rather than
          # piped into `grep -q`: under `pipefail` an early-exiting grep
          # SIGPIPEs its producer, and the pipeline then reports 141 whether or
          # not anything matched.
          shopt -s nullglob
          stray=("${dir}"/*.sigstore.json.asc)
          shopt -u nullglob
          if [ "${#stray[@]}" -gt 0 ]; then
            echo "::error::a .sigstore.json.asc was published — the sigstore plugin's .asc removal stopped working"
            printf '%s\n' "${stray[@]}"
            missing=1
          fi

          [ "${missing}" -eq 0 ] || exit 1
          echo "OK: every publishable file has both a .asc and a .sigstore.json."

  # Publishing to Maven Central is IRREVERSIBLE and refuses to re-use a version.
  # Git tags are not branch-scoped, so a release tag cut on a feature branch must
  # be proven to be on main before the publish job runs.
  verify-tag-on-main:
    name: Verify tag is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is NOT on origin/main. Release tags must be cut from main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."
      - name: Assert the tag matches gradle.properties version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          proj_version="$(grep -E '^version=' gradle.properties | cut -d= -f2)"
          if [ "${tag_version}" != "${proj_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies ${tag_version}, but gradle.properties declares ${proj_version}."
            exit 1
          fi
          echo "OK: tag and gradle.properties agree on ${tag_version}."

  publish:
    name: Publish to Maven Central
    # Manual-on-tag, side-effecting: runs only on a vX.Y.Z tag push, never on a
    # pull_request, so the GPG_PRIVATE_KEY / CENTRAL_TOKEN_* secrets are never
    # exposed to a PR-triggered job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
      # See the Java SDK's publish job for the full rationale: Maven Central has
      # no trusted-publishing equivalent, so this job holds a stored Portal
      # token, and build provenance is the thing an integrator can check that
      # the token cannot forge.
      #
      # OWNER ACTION, not expressible here: `CENTRAL_TOKEN_*`, `GPG_PRIVATE_KEY`
      # and `GPG_PASSPHRASE` must be ENVIRONMENT secrets of `maven-central`
      # (not repository secrets), with required reviewers and a `v*` deployment
      # tag rule on the environment.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
      - name: Publish (GPG- and Sigstore-signed) to the OSSRH Staging API
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: ./gradlew publish --no-daemon -Psigstore.enabled=true

      # T-148 / H-1: build provenance over the jars, BEFORE the step below
      # forwards the staging repository to the Portal. The ordering matters here
      # in a way it cannot in the Maven job: `./gradlew publish` only stages, so
      # attesting between the two steps means nothing reaches Maven Central
      # unattested.
      #
      #   gh attestation verify axiam-sdk-<version>.jar --repo ilpanich/axiam-kotlin-sdk
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: build/libs/*.jar

      # `./gradlew publish` only does the OSSRH-protocol PUTs, which land the
      # artifacts in an *open* staging repository on the OSSRH Staging API. The
      # maven-publish plugin never closes/forwards that repo, so without this
      # step the deployment never reaches the Central Portal Deployments view and
      # is never published — the build goes green but nothing lands on Central.
      #
      # This POST closes the namespace's default staging repository and forwards
      # it to the Portal. publishing_type=automatic auto-releases to Maven
      # Central once validation passes; switch to user_managed to instead have it
      # wait for a manual "Publish" click in the Deployments view.
      - name: Close & forward the staging repository to the Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          namespace="$(grep -E '^group=' gradle.properties | cut -d= -f2)"
          token="$(printf '%s:%s' "${CENTRAL_TOKEN_USERNAME}" "${CENTRAL_TOKEN_PASSWORD}" | base64 -w0)"
          echo "Forwarding default staging repository for namespace '${namespace}' to the Central Portal…"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${token}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${namespace}?publishing_type=automatic"
