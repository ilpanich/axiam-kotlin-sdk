# .github/dependabot.yml
# Automated dependency updates. Mirrors the AXIAM monorepo and the TypeScript
# SDK: weekly on Monday, minor and patch bumps grouped into a single PR so the
# CI matrix runs once per batch; majors arrive one per PR to be reviewed alone.
version: 2
updates:
  # Gradle: build.gradle.kts / settings.gradle.kts and the wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    # Runtime dependencies are held at the last release whose kotlin-stdlib is
    # no newer than kotlinVersion in gradle.properties (2.2.21): a newer
    # stdlib does not compile on the floor CI leg and would raise the Kotlin
    # floor for every consumer. Lift these together with kotlinVersion.
    ignore:
      - dependency-name: org.jetbrains.kotlinx:kotlinx-serialization-json
        versions: [">= 1.10.0"]   # 1.10 needs kotlin-stdlib 2.3, 1.12+ needs 2.4
      - dependency-name: "io.ktor:*"
        versions: [">= 3.4.0"]    # 3.4 needs kotlin-stdlib 2.3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
