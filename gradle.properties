group=io.github.ilpanich
version=1.4.0

org.gradle.caching=true
org.gradle.parallel=true
# Heap for the Gradle daemon and the Kotlin compile daemon. Gradle's default
# daemon heap is 512 MB. That is enough for a plain build, where Kotlin compiles
# in its own daemon. It is not enough when the compiler runs inside Gradle
# (kotlin.compiler.execution.strategy=in-process), which is how CodeQL's
# java-kotlin autobuild traces the compilation: ~330 sources plus the extractor
# ran out of heap in :compileKotlin after 18 minutes on a standard runner.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
kotlin.code.style=official
kotlinVersion=2.2.21

# Gradle's toolchain auto-detection does not scan GitHub Actions'
# hostedtoolcache, so the JDKs actions/setup-java installs are invisible to it
# unless named here. These env vars are absent locally, where the entry is a
# harmless no-op.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_27_X64

