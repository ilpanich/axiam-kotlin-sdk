group=io.github.ilpanich
version=1.0.0-alpha44

org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlinVersion=2.1.0

# Gradle's toolchain auto-detection does not scan GitHub Actions'
# hostedtoolcache, so the JDKs actions/setup-java installs are invisible to it
# unless named here. These env vars are absent locally, where the entry is a
# harmless no-op.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

